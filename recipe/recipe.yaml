schema_version: 1

context:
  name: numpydantic
  version: "1.10.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/numpydantic-${{ version }}.tar.gz
  sha256: a17d5ccc3b893c4a2e539c81c2f18960d70884ad7fcaa09c9eb56a95e8daf4a3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - pdm-backend
    - pip
  run:
    - python >=${{ python_min }},<4.0
    - pydantic >=2.3.0
    - numpy >=1.24.0
    - typing-extensions >=4.11.0

tests:
  - python:
      imports:
        - numpydantic
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Type and shape validation and serialization for numpy arrays in pydantic models
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/p2p-ld/numpydantic
  repository: https://github.com/p2p-ld/numpydantic
  documentation: https://numpydantic.readthedocs.io/

extra:
  recipe-maintainers:
    - sneakers-the-rat
    - apcamargo

