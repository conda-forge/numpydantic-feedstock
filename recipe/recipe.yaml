# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.0"
  # key dependency floors to `pip check`
  pydantic_min: "2.7.0"
  numpy_min: "2.0.0"
  # check solve/import/check with a specific version of python instead of `*` (read: some python)
  python_check_max: "3.15"
  # tests that rely on specific type checker version outputs
  unlink_tests: test_pyright.py test_mypy.py

package:
  name: numpydantic
  version: ${{ version }}

source:
  - url: https://files.pythonhosted.org/packages/source/n/numpydantic/numpydantic-${{ version }}.tar.gz
    sha256: 453f79b6baa99ee7da9c93e5ca8ae3d27ec50f047017cd55837f0756f512165e
  - target_directory: src/numpydantic/vendor/nptyping
    url: https://raw.githubusercontent.com/ramonhagenaars/nptyping/refs/tags/v2.5.0/LICENSE
    sha256: c9592e4cc7ac9023931008a31cf278ba39a4619b82ec5d045ba069fc3ac81a7b

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies
    - ${{ PYTHON }} -c "import os; [os.unlink(f'tests/{p}') for p in '''${{ unlink_tests }}'''.split()]"

requirements:
  host:
    - pdm-backend
    - pip
    - python ${{ python_min }}.*
  run:
    - numpy >=${{ numpy_min }}
    - pydantic >=${{ pydantic_min }}
    - python >=${{ python_min }}
    - typing-extensions >=4.11.0

tests:
  - package_contents:
      strict: true
      files:
        - etc/conda/test-files/numpydantic/**
      site_packages:
        - numpydantic/**
        - numpydantic-${{ version }}.dist-info/**
  - python:
      imports: numpydantic
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - files:
      source:
        - pyproject.toml
        - tests/**
    requirements:
      run:
        - pytest >=7.4.0
        - pytest-cov >=4.1.0
        - pytest-xdist >=3.8.0
        - typing_extensions >=4.16.0
        # all the runtime [extras]; add to `requirements/extras` when CEP-44 is ready
        - dask >=2024.4.0
        - h5py >=3.10.0
        - opencv >=4.9.0.80
        - zarr >=3.1.0
        # for extra floor pip check
        - pip
        - python ${{ python_min }}.*
        - numpy ${{ numpy_min }}.*
        - pydantic ${{ pydantic_min }}.*
    script:
      env:
        NUMCODECS_ALLOW_UNSAFE_PICKLE_DECODE: "1"
      content:
        - pip check
        - pytest -vv --tb=long --color=yes

about:
  summary: |-
    Type and shape validation and serialization for arbitrary array types in pydantic models
  license: MIT
  license_file:
    - LICENSE
    - src/numpydantic/vendor/nptyping/LICENSE
  homepage: https://pypi.org/project/numpydantic
  repository: https://github.com/p2p-ld/numpydantic
  documentation: https://numpydantic.readthedocs.io

extra:
  recipe-maintainers:
    - sneakers-the-rat
    - apcamargo
    - bollwyvl
