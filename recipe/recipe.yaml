# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.10.0"
  # key dependency floors to `pip check`
  pydantic_min: "2.7.0"
  numpy_min: "2.0.0"
  # check solve/import/check with a specific version of python instead of `*` (read: some python)
  python_check_max: "3.15"

package:
  name: numpydantic
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/n/numpydantic/numpydantic-${{ version }}.tar.gz
  sha256: a17d5ccc3b893c4a2e539c81c2f18960d70884ad7fcaa09c9eb56a95e8daf4a3

build:
  number: 1
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies

requirements:
  host:
    - pdm-backend
    - pip
    - python ${{ python_min }}.*
  run:
    - numpy >=${{ numpy_min }}
    - pydantic >=${{ pydantic_min }}
    - python >=${{ python_min }}
    - typing-extensions >=4.11.0

tests:
  - package_contents:
      strict: true
      files:
        - etc/conda/test-files/numpydantic/**
      site_packages:
        - numpydantic/**
        - numpydantic-${{ version }}.dist-info/**
  - python:
      imports: numpydantic
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - files:
      source:
        - tests/**
    requirements:
      run:
        - pytest >=7.4.0
        # all the functional [extras]; add to `requirements/extras` when CEP-44 is ready
        - dask >=2024.4.0
        - h5py >=3.10.0
        - opencv-python >=4.9.0.80
        - zarr >=2.17.2,<3.0.0
        - mypy >=1.17.1
        # for extra floor pip check
        - pip
        - python ${{ python_min }}.*
        - numpy ${{ numpy_min }}.*
        - pydantic ${{ pydantic_min }}.*
    script:
      - pip check
      - pytest -vv --tb=long --color=yes

about:
  summary: |-
    Type and shape validation and serialization for arbitrary array types in pydantic models
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/numpydantic
  repository: https://github.com/p2p-ld/numpydantic
  documentation: https://numpydantic.readthedocs.io

extra:
  recipe-maintainers:
    - sneakers-the-rat
    - apcamargo
